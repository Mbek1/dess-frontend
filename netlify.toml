[build]
  command = "npm run build"
  publish = "dist"

# Proxy API calls through the Netlify origin so the browser treats the
# HttpOnly refresh cookie as first-party instead of a third-party cookie.
[[redirects]]
  from = "/api/*"
  to = "https://dess-y5kz.onrender.com/api/:splat"
  status = 200
  force = true

# Keep backend-hosted uploads and avatar paths available through the same origin.
[[redirects]]
  from = "/uploads/*"
  to = "https://dess-y5kz.onrender.com/uploads/:splat"
  status = 200
  force = true
